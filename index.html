<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For You</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #fff0f5, #f4efff);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: white;
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.1);
    }

    h1, h2 {
      text-align: center;
    }

    .progress {
      text-align: center;
      color: #888;
      margin-bottom: 25px;
    }

    .option {
      display: block;
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      border: 2px solid #eee;
      border-radius: 14px;
      background: white;
      cursor: pointer;
      font-size: 16px;
      transition: 0.2s;
    }

    .option:hover {
      border-color: #ff7faa;
      background: #fff6f9;
    }

    .option.selected {
      border-color: #ff6f9f;
      background: #ffe9f1;
    }

    .next-btn {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: #ff6f9f;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .next-btn:disabled {
      background: #ccc;
      cursor: default;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }

    .success {
      background: #111;
      color: #6aff8d;
      font-family: monospace;
      padding: 20px;
      border-radius: 14px;
      text-align: center;
      line-height: 1.8;
      margin-bottom: 25px;
    }

    .letter {
      background: #fffaf4;
      padding: 25px;
      border-radius: 16px;
      line-height: 2;
      font-family: serif;
      white-space: pre-line;
    }

    .hidden {
      display: none;
    }

    .fade {
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div id="quizScreen" class="fade">

    <div class="progress" id="progress">
      Question 1 / 5
    </div>

    <h2 id="question">
      問題
    </h2>

    <div id="options"></div>

    <button
      id="nextButton"
      class="next-btn"
      disabled
    >
      回答する
    </button>

    <div id="message" class="message"></div>

  </div>


  <div id="letterScreen" class="hidden fade">

    <div class="success">
      AUTHENTICATION SUCCESS<br><br>

      USER VERIFIED ✓<br>
      ACCESS LEVEL : LOVER<br><br>

      Decrypting message...<br>
      ████████████████ 100%
    </div>

    <h1>💌 ○○へ</h1>

    <div class="letter">
○○へ

ここまで来てくれてありがとう。

普通に手紙を渡すだけじゃ
ちょっとつまらないと思って、
こんなのを作ってみました。

一緒に過ごしてきた時間も、
これから過ごす時間も、
全部大事にしていきたいです。

これからもいっぱい笑って、
いっぱい思い出作ろう。

いつもありがとう。

大好きです。
    </div>

  </div>

</div>


<script>

const questions = [

  {
    question: "初めてデートした場所は？",
    options: [
      "水族館",
      "映画館",
      "カフェ",
      "ゲームセンター",
      "公園"
    ],
    answer: 0
  },

  {
    question: "初めて一緒に食べたものは？",
    options: [
      "ラーメン",
      "焼肉",
      "寿司",
      "パスタ",
      "ハンバーグ"
    ],
    answer: 1
  },

  {
    question: "俺が一番好きなのは？",
    options: [
      "ゲーム",
      "ダーツ",
      "寝ること",
      "ご飯",
      "あなた"
    ],
    answer: 4
  },

  {
    question: "思い出の場所はどこ？",
    options: [
      "水族館",
      "カラオケ",
      "公園",
      "ゲームセンター",
      "映画館"
    ],
    answer: 0
  },

  {
    question: "これからも一緒にいてくれますか？",
    options: [
      "はい",
      "もちろん",
      "当然",
      "ずっと",
      "全部正解"
    ],
    answer: 4
  }

];


let currentQuestion = 0;
let selectedAnswer = null;


const questionText =
  document.getElementById("question");

const optionsContainer =
  document.getElementById("options");

const nextButton =
  document.getElementById("nextButton");

const progress =
  document.getElementById("progress");

const message =
  document.getElementById("message");


function showQuestion() {

  selectedAnswer = null;

  nextButton.disabled = true;

  message.textContent = "";

  const q = questions[currentQuestion];

  progress.textContent =
    `Question ${currentQuestion + 1} / ${questions.length}`;

  questionText.textContent =
    q.question;

  optionsContainer.innerHTML = "";


  q.options.forEach((option, index) => {

    const button =
      document.createElement("button");

    button.textContent = option;

    button.classList.add("option");


    button.onclick = () => {

      document
        .querySelectorAll(".option")
        .forEach(btn => {
          btn.classList.remove("selected");
        });


      button.classList.add("selected");

      selectedAnswer = index;

      nextButton.disabled = false;

    };


    optionsContainer.appendChild(button);

  });

}


nextButton.onclick = () => {

  if (selectedAnswer === null) {
    return;
  }


  const q =
    questions[currentQuestion];


  if (selectedAnswer !== q.answer) {

    message.textContent =
      "❌ ACCESS DENIED";

    return;
  }

  nextButton.disabled = true;

  message.textContent =
    "✓ 正解";


  setTimeout(() => {

    currentQuestion++;


    if (
      currentQuestion >= questions.length
    ) {

      showLetter();

    }
    else {

      showQuestion();

    }

  }, 500);

};


function showLetter() {

  document
    .getElementById("quizScreen")
    .classList.add("hidden");

  document
    .getElementById("letterScreen")
    .classList.remove("hidden");

}


showQuestion();

</script>

</body>
</html>
